<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rent roll · Larkspur Property Group</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><a href="/">Larkspur Property Group · Lease Billing</a></header>
  <main>
    <h1 id="property-name">Loading…</h1>
    <p class="muted" id="property-meta"></p>
    <p id="message" class="message"></p>

    <h2>Rent roll</h2>
    <form id="as-of-form" class="toolbar">
      <label>As of <input type="date" name="as_of"></label>
      <button type="submit">Show</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>Unit</th>
          <th class="num">Sq ft</th>
          <th>Tenant</th>
          <th>Lease start</th>
          <th>Lease end</th>
          <th class="num">Monthly rent</th>
          <th class="num">Balance</th>
        </tr>
      </thead>
      <tbody id="units"></tbody>
      <tfoot id="totals"></tfoot>
    </table>
  </main>
  <script type="module" src="/js/property.js"></script>
</body>
</html>
