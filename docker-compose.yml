services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leases
      POSTGRES_PASSWORD: leases
      POSTGRES_DB: leases
    ports:
      # 5433 on your machine so it doesn't clash with another Postgres on 5432.
      - "5433:5432"
    volumes:
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
